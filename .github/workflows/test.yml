name: test formula

# The formula is generated on a Windows machine, where `brew` does not exist.
# This is the only place it is ever actually built and installed, so it runs on
# every push and weekly — a tap nobody exercises is a tap that is quietly broken
# by the time someone tries to install from it.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Mondays
  workflow_dispatch: {}

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is macOS 26, too new for prebuilt bottles: Homebrew fell
        # back to compiling mpv's whole tree from source and ran 40 minutes
        # without finishing. macos-15 has bottles.
        include:
          # Both get the same budget. It was raised to 75 twice while the build
          # kept growing into it, and the second time was the wrong fix: 32 of
          # those minutes were Pillow being compiled from its sdist, and 0.2.89
          # pours Homebrew's bottle instead. Measured since:
          #   Linux  49m52s -> 13m57s   (0.2.87 was cancelled at 75m)
          #   macOS  46m20s -> 11m03s
          # 75 is now headroom rather than a fit, which is what it should have
          # been. A budget that has to be raised every few releases is measuring
          # something nobody looked at - here, one resource out of twenty-nine.
          - os: macos-15
            timeout: 75
          - os: ubuntu-latest
            timeout: 75
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      # macOS runners ship Homebrew; Linux runners do not.
      - name: Install Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v5
        with:
          path: checkout

      # `brew audit`/`install` on a bare path is disabled — they work on taps.
      # Copying the checkout into Homebrew's own Taps directory tests *this*
      # commit, rather than whatever happens to be pushed.
      - name: Register the checkout as a tap
        run: |
          taps="$(brew --repository)/Library/Taps/anime123450"
          mkdir -p "$taps"
          cp -R checkout "$taps/homebrew-anime-sh"

      - name: Lint the formula
        run: brew audit --formula anime123450/anime-sh/anime-sh

      - name: Install from source
        run: brew install --build-from-source anime123450/anime-sh/anime-sh

      - name: Run the formula's own test block
        run: brew test anime123450/anime-sh/anime-sh

      - name: It actually runs
        run: anime --version
